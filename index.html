<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إلى ملاك ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  background:#fff1f6;
  color:#442333;
  overflow-x:hidden;
}

button{font-family:inherit}

.lock{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ffe3ee,#fff8fb);
  z-index:100;
  padding:24px;
}

.card{
  width:min(430px,100%);
  background:#fff;
  border-radius:28px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 18px 60px #c65d8a33;
}

.heart{font-size:52px}

.card h1{
  margin:8px 0;
  font-size:28px;
}

.card p{color:#8b6274}

.pin{
  font-size:30px;
  letter-spacing:12px;
  text-align:center;
  width:100%;
  border:0;
  border-bottom:2px solid #f19abb;
  outline:0;
  padding:12px;
  background:transparent;
  color:#442333;
}

.unlock{
  margin-top:20px;
  border:0;
  border-radius:999px;
  background:#ef6f9f;
  color:#fff;
  font-size:18px;
  font-weight:700;
  padding:13px 30px;
  cursor:pointer;
}

.err{
  height:24px;
  color:#d44a78;
  margin-top:8px;
}

.page{
  display:none;
  min-height:100vh;
  padding:35px 20px;
}

.page.active{display:block}

.center{
  max-width:900px;
  margin:auto;
  text-align:center;
}

/* السؤال */

.question{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
}

.question.active{display:flex}

.question-box{
  background:white;
  border-radius:30px;
  padding:45px 25px;
  width:min(500px,100%);
  box-shadow:0 15px 50px #9b416622;
}

.question-box h1{
  font-size:38px;
  color:#d95386;
  margin:15px 0;
}

.question-box p{
  font-size:18px;
  color:#8b6274;
}

.yesno{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:30px;
}

.btn{
  border:0;
  border-radius:999px;
  padding:15px 32px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.yes{
  background:#ef6f9f;
  color:white;
}

.no{
  background:white;
  color:#d95386;
  border:2px solid #efb0c7;
}

#reply{
  margin-top:20px;
  color:#d95386;
  font-weight:800;
  min-height:30px;
}

/* الهدايا */

.gifts{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
}

.gifts.active{display:flex}

.gift-container{
  width:min(950px,100%);
}

.gift-title{
  text-align:center;
  color:#d95386;
  font-size:35px;
  margin-bottom:45px;
}

.gift-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.gift{
  width:30%;
  min-height:190px;
  border:0;
  border-radius:30px;
  background:white;
  box-shadow:0 15px 40px #9b416622;
  cursor:pointer;
  transition:.25s;
  color:#442333;
  padding:25px 15px;
}

.gift:hover{
  transform:translateY(-10px);
}

.gift-icon{font-size:60px}

.gift h2{
  margin:12px 0 5px;
  color:#d95386;
}

.gift p{
  margin:0;
  color:#9a6b7e;
}

/* العناوين */

.inner-title{
  text-align:center;
  color:#d95386;
  font-size:36px;
  margin-bottom:35px;
}

.back{
  display:block;
  margin:35px auto 0;
  border:0;
  border-radius:999px;
  padding:12px 25px;
  background:#fff;
  color:#d95386;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 20px #9b416622;
}

/* الصور */

.photo-grid{
  max-width:950px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:25px;
}

.photo{
  background:white;
  padding:10px 10px 25px;
  box-shadow:0 10px 30px #9b416633;
  transform:rotate(var(--r));
}

.photo img{
  width:100%;
  height:270px;
  object-fit:cover;
  display:block;
}

/* الأسطوانة */

.music-page{
  position:relative;
  overflow:hidden;
}

.music-area{
  position:relative;
  max-width:900px;
  min-height:650px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.song-box{
  width:min(500px,80%);
  position:relative;
  z-index:5;
  text-align:center;
}

.record{
  width:330px;
  height:330px;
  margin:auto;
  border-radius:50%;
  background:
    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 4px,
      #292929 5px,
      #111 7px
    );
  box-shadow:
    0 20px 50px #0005,
    inset 0 0 25px #000;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:spin 5s linear infinite;
}

.record::before{
  content:"";
  width:112px;
  height:112px;
  border-radius:50%;
  background:#ef6f9f;
  position:absolute;
}

.cover{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  position:relative;
  z-index:2;
}

.record-hole{
  position:absolute;
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  z-index:3;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.song-name{
  text-align:center;
  font-weight:800;
  color:#d95386;
  font-size:21px;
  margin-top:25px;
}

/* الصور حول الأسطوانة */

.music-photo{
  position:absolute;
  width:110px;
  background:white;
  padding:7px 7px 18px;
  box-shadow:0 10px 25px #9b416644;
  z-index:2;
}

.music-photo img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.m1{top:15px;left:5%;transform:rotate(-10deg)}
.m2{top:70px;right:5%;transform:rotate(9deg)}
.m3{bottom:50px;left:4%;transform:rotate(8deg)}
.m4{bottom:25px;right:6%;transform:rotate(-8deg)}
.m5{top:0;left:42%;transform:rotate(5deg)}
.m6{bottom:0;right:42%;transform:rotate(-5deg)}

/* رسالة */

.letter{
  max-width:700px;
  margin:auto;
  background:white;
  padding:40px 28px;
  border-radius:30px;
  box-shadow:0 15px 50px #9b416622;
  font-size:20px;
  line-height:2.1;
  text-align:center;
}

.letter .emoji{
  font-size:55px;
  margin-bottom:10px;
}

/* الأسطوانة الصغيرة للرسالة */

.letter-layout{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:40px;
  direction:ltr;
}

.letter-music{
  width:230px;
  flex-shrink:0;
  text-align:center;
}

.small-record{
  width:190px;
  height:190px;
  border-radius:50%;
  margin:auto;
  background:
    repeating-radial-gradient(
      circle,
      #111 0px,
      #111 3px,
      #292929 4px,
      #111 6px
    );
  display:flex;
  align-items:center;
  justify-content:center;
  animation:spin 5s linear infinite;
  box-shadow:0 15px 35px #0004;
}

.small-cover{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
}

.letter-content{
  flex:1;
  direction:rtl;
}

footer{
  text-align:center;
  padding:35px;
  color:#9a6b7e;
}

/* شاشة القلب */

.heart-transition{
  position:fixed;
  inset:0;
  background:#fff1f6;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
}

.heart-transition.show{
  display:flex;
}

.big-heart{
  font-size:150px;
  animation:heartBeat 1s ease-in-out;
}

@keyframes heartBeat{
  0%{transform:scale(.4);opacity:0}
  50%{transform:scale(1.15);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.cracked{
  animation:crack 1.2s forwards;
}

@keyframes crack{
  0%{transform:scale(1);opacity:1}
  60%{transform:scale(1.2) rotate(4deg)}
  100%{transform:scale(1.7);opacity:0}
}

.om{
  position:absolute;
  font-size:55px;
  font-weight:900;
  color:#d95386;
  opacity:0;
}

.om.show{
  animation:showOM 1.2s forwards;
}

@keyframes showOM{
  from{transform:scale(.3);opacity:0}
  to{transform:scale(1);opacity:1}
}

#hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:300;
}

.float{
  position:absolute;
  animation:up 4s linear forwards;
}

@keyframes up{
  from{
    transform:translateY(0);
    opacity:1;
  }
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}

@media(max-width:650px){

  .gift-row{
    flex-direction:column;
  }

  .gift{
    width:90%;
  }

  .music-area{
    min-height:680px;
  }

  .music-photo{
    width:70px;
  }

  .music-photo img{
    height:80px;
  }

  .record{
    width:250px;
    height:250px;
  }

  .cover{
    width:82px;
    height:82px;
  }

  .m1{top:20px;left:2%}
  .m2{top:70px;right:2%}
  .m3{bottom:80px;left:2%}
  .m4{bottom:55px;right:2%}
  .m5{top:0;left:38%}
  .m6{bottom:10px;right:38%}

  .letter-layout{
    flex-direction:column;
  }

  .letter-music{
    order:2;
  }

  .letter-content{
    order:1;
  }

  .small-record{
    width:150px;
    height:150px;
  }
}
</style>
</head>

<body>

<!-- القفل -->

<div class="lock" id="lock">

  <div class="card">

    <div class="heart">💗</div>

    <h1>عندك رسالة خاصة</h1>

    <p>دخلي الرقم السري عشان تفتحيها 🌷</p>

    <input
      id="pin"
      class="pin"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <button class="unlock" onclick="unlock()">
      فتح الرسالة ❤️
    </button>

    <div id="err" class="err"></div>

  </div>

</div>


<!-- السؤال -->

<section class="page question" id="questionPage">

  <div class="question-box center">

    <div style="font-size:60px">❤️</div>

    <h1>واش كتحبيني؟</h1>

    <p>جاوبيني بصراحة... 😭❤️</p>

    <div class="yesno">

      <button class="btn yes" id="yes">
        YES ❤️
      </button>

      <button class="btn no" id="no">
        NO 😭
      </button>

    </div>

    <div id="reply"></div>

  </div>

</section>


<!-- الهدايا -->

<section class="page gifts" id="giftsPage">

  <div class="gift-container">

    <h1 class="gift-title">
      عندك ثلاث هدايا 🎁❤️
    </h1>

    <div class="gift-row">

      <button class="gift" onclick="showPage('photosPage')">

        <div class="gift-icon">📸</div>

        <h2>صورنا</h2>

        <p>ذكرياتنا ❤️</p>

      </button>

      <button class="gift" onclick="showPage('musicPage')">

        <div class="gift-icon">🎵</div>

        <h2>أغنيتنا</h2>

        <p>أغنية تذكرني فيك 🎶</p>

      </button>

      <button class="gift" onclick="startLetter()">

        <div class="gift-icon">💌</div>

        <h2>رسالتي</h2>

        <p>شي من قلبي ليك ❤️</p>

      </button>

    </div>

  </div>

</section>


<!-- صفحة الصور -->

<section class="page" id="photosPage">

  <div class="center">

    <h1 class="inner-title">
      ذكرياتنا 📸❤️
    </h1>

    <div class="photo-grid">

      <div class="photo" style="--r:-3deg">
        <img src="image1.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:3deg">
        <img src="image2.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:-2deg">
        <img src="image3.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:4deg">
        <img src="image4.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:-4deg">
        <img src="image5.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:2deg">
        <img src="image6.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:-2deg">
        <img src="image7.jpeg" alt="صورة">
      </div>

      <div class="photo" style="--r:3deg">
        <img src="image8.jpeg" alt="صورة">
      </div>

    </div>

    <button class="back" onclick="showPage('giftsPage')">
      ← رجوع للهدايا
    </button>

  </div>

</section>


<!-- صفحة الأغنية -->

<section class="page music-page" id="musicPage">

  <h1 class="inner-title">
    أغنيتنا 🎵❤️
  </h1>

  <div class="music-area">

    <div class="music-photo m1">
      <img src="image1.jpeg">
    </div>

    <div class="music-photo m2">
      <img src="image2.jpeg">
    </div>

    <div class="music-photo m3">
      <img src="image3.jpeg">
    </div>

    <div class="music-photo m4">
      <img src="image4.jpeg">
    </div>

    <div class="music-photo m5">
      <img src="image5.jpeg">
    </div>

    <div class="music-photo m6">
      <img src="image6.jpeg">
    </div>

    <div class="song-box">

      <div class="record">

        <img
          class="cover"
          src="image1.jpeg"
          alt="غلاف الأغنية"
        >

        <div class="record-hole"></div>

      </div>

      <div class="song-name">
        أغنيتنا ❤️🎶
      </div>

      <div style="margin-top:15px;color:#9a6b7e">
        المقطع: 0:45 — 1:26
      </div>

      <!-- YouTube -->
      <div style="margin-top:20px">
        <iframe
          id="musicPlayer"
          width="0"
          height="0"
          src="https://www.youtube.com/embed/ZvlzB5gUD-g?start=45&end=86"
          allow="autoplay; encrypted-media"
          style="border:0">
        </iframe>
      </div>

    </div>

  </div>

  <button class="back" onclick="showPage('giftsPage')">
    ← رجوع للهدايا
  </button>

</section>


<!-- صفحة الرسالة -->

<section class="page" id="letterPage">

  <h1 class="inner-title">
    رسالة ليك 💌
  </h1>

  <div class="letter-layout">

    <div class="letter-content">

      <div class="letter">

        <div class="emoji">💌🌷</div>

        ملاك ❤️

        <br><br>

        بغيت غير نقولك بلي كنبغ
