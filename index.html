<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إلى ملاك ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#fff1f6;color:#442333;overflow-x:hidden}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe3ee,#fff8fb);z-index:20;padding:24px}
.card{width:min(430px,100%);background:#fff;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 18px 60px #c65d8a33}
.heart{font-size:52px}.card h1{margin:8px 0;font-size:28px}.card p{color:#8b6274}
.pin{font-size:30px;letter-spacing:12px;text-align:center;width:100%;border:0;border-bottom:2px solid #f19abb;outline:0;padding:12px;background:transparent;color:#442333}
.unlock{margin-top:20px;border:0;border-radius:999px;background:#ef6f9f;color:#fff;font-size:18px;font-weight:700;padding:13px 30px}
.err{height:24px;color:#d44a78;margin-top:8px}
.site{display:none}.hero{text-align:center;padding:70px 20px 35px;background:radial-gradient(circle at 50% 0,#ffd7e7,transparent 60%)}
.hero h1{font-size:42px;margin:10px 0;color:#d95386}.hero p{font-size:19px;line-height:1.9;max-width:680px;margin:auto}
.yesno{margin:25px auto 50px;display:flex;gap:18px;justify-content:center;align-items:center;min-height:90px}
.btn{border:0;border-radius:999px;padding:14px 30px;font-size:18px;font-weight:800;cursor:pointer;transition:.18s}
.yes{background:#ef6f9f;color:#fff}.no{background:#fff;color:#d95386;border:2px solid #efb0c7}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;max-width:1050px;margin:0 auto;padding:20px}
.gallery img{width:100%;height:330px;object-fit:cover;border-radius:22px;box-shadow:0 8px 30px #9b416622}
.message{max-width:700px;margin:45px auto;padding:30px 24px;background:#fff;border-radius:28px;box-shadow:0 10px 35px #9b41661c;text-align:center;font-size:20px;line-height:2}
footer{text-align:center;padding:45px 20px;color:#9a6b7e}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:10}
.float{position:absolute;animation:up 4s linear forwards;font-size:24px}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-110vh);opacity:0}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="card">
    <div class="heart">💗</div>
    <h1>عندك رسالة خاصة</h1>
    <p>دخلي الرقم السري عشان تفتحيها 🌷</p>
    <input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="الرقم السري">
    <button class="unlock" onclick="unlock()">فتح الرسالة ❤️</button>
    <div id="err" class="err"></div>
  </div>
</div>

<main class="site" id="site">
  <section class="hero">
    <div style="font-size:55px">🌷❤️</div>
    <h1>إلى ملاك</h1>
    <p>بغيت نقولك يا ملاك أنا كنبغيك بزاف، وبغيت نقولك إن شاء الله ربي يطوّل بيناتنا عمرنا وما نبعدو على بعضياتنا ❤️</p>
    <p>باباتك كيبغيك ❤️🌷</p>
  </section>

  <section class="message">
    <div style="font-size:40px">💌</div>
    <div>مهما كبرت المسافة، قلبي ديما قريب منك.<br>وإن شاء الله تبقى ضحكتك أجمل حاجة في أيامي.</div>
    <div class="yesno">
      <button class="btn yes" id="yes">YES ❤️</button>
      <button class="btn no" id="no">NO</button>
    </div>
    <div id="reply" style="font-weight:800;color:#d95386;min-height:32px"></div>
  </section>

  <section class="gallery">
    <img src="images/image1.jpeg" alt="صورة">
    <img src="images/image2.jpeg" alt="صورة">
    <img src="images/image3.jpeg" alt="صورة">
    <img src="images/image4.jpeg" alt="صورة">
    <img src="images/image5.jpeg" alt="صورة">
    <img src="images/image6.jpeg" alt="صورة">
    <img src="images/image7.jpeg" alt="صورة">
    <img src="images/image8.jpeg" alt="صورة">
  </section>
  <footer>صُنعت بحب ❤️</footer>
</main>
<div id="hearts"></div>

<script>
function unlock(){
  const p=document.getElementById('pin').value;
  const e=document.getElementById('err');
  if(p==="1614"){
    document.getElementById('lock').style.display="none";
    document.getElementById('site').style.display="block";
  }else{
    e.textContent="الرقم مو صحيح 😭❤️";
    document.getElementById('pin').value="";
  }
}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==="Enter")unlock()});

const no=document.getElementById('no'), yes=document.getElementById('yes'), reply=document.getElementById('reply');
let scale=1;
no.addEventListener('click',()=>{
  scale=Math.min(scale+0.28,5);
  yes.style.transform=`scale(${scale})`;
  no.style.transform=`scale(${Math.max(.45,1-(scale-1)*.13)})`;
  reply.textContent="لا لا 😭 اضغطي YES ❤️";
});
yes.addEventListener('click',()=>{
  reply.textContent="كنت عارف إنك بتختارين YES 😭❤️🌷";
  for(let i=0;i<28;i++) setTimeout(spawnHeart,i*45);
});
function spawnHeart(){
  const h=document.createElement('div');h.className='float';h.textContent=['❤️','💗','💕','🌷'][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+'vw';h.style.bottom='-30px';h.style.fontSize=(18+Math.random()*24)+'px';
  document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),4100);
}
</script>
</body>
</html>
